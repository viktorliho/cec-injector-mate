<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="cec-injector-mate">
    <allow own="org.cecinjector.Mate"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.cecinjector.Mate" send_interface="org.cecinjector.Mate1" send_member="GetStatus"/>
    <allow send_destination="org.cecinjector.Mate" send_interface="org.cecinjector.Mate1" send_member="GetCapabilities"/>
    <allow send_destination="org.cecinjector.Mate" send_interface="org.cecinjector.Mate1" send_member="GetConfiguration"/>
    <allow receive_sender="org.cecinjector.Mate" receive_interface="org.cecinjector.Mate1"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="org.cecinjector.Mate" send_interface="org.cecinjector.Mate1" send_member="SetConfiguration"/>
    <allow send_destination="org.cecinjector.Mate" send_interface="org.cecinjector.Mate1" send_member="RequestAction"/>
  </policy>
</busconfig>
