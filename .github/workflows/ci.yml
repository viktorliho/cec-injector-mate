name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable tests
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Install host dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates cmake g++ git make

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure
        run: cmake --preset host-debug

      - name: Build
        run: cmake --build --preset host-debug

      - name: Test
        run: ctest --preset host-debug

  macos-portable:
    name: macOS portable
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure
        run: |
          cmake -S . -B build/ci-macos-portable \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci-macos-portable --parallel

      - name: Test
        run: ctest --test-dir build/ci-macos-portable --output-on-failure

  linux:
    name: Linux and packaging tests
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Install Linux dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates cmake g++ git libdrm-dev libsystemd-dev \
            libudev-dev make pkg-config systemd

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure
        run: |
          cmake -S . -B build/ci-linux \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCEC_INJECTOR_MATE_BUILD_LINUX=ON

      - name: Build
        run: cmake --build build/ci-linux --parallel

      - name: Test Linux, packaging, diagnostics, and boundaries
        run: ctest --test-dir build/ci-linux --output-on-failure

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *zsh*) zsh -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done < <(find packaging -type f -name '*.sh' -print | sort)

      - name: Verify systemd templates
        shell: bash
        run: |
          set -euo pipefail
          units=$(mktemp -d)
          trap 'rm -rf -- "$units"' EXIT
          for name in cec-injector-mate.service cec-injector-mate-boot.service; do
            sed \
              -e 's|@EXECUTABLE@|/bin/true|g' \
              -e 's|@DEVICE_ID@|linux-usb-serial-v1:544553542D43492D444556494345|g' \
              -e 's|/opt/cec-injector-mate/current/libexec/readiness daemon 30|/bin/true|g' \
              "packaging/linux/${name}.in" >"${units}/${name}"
          done
          systemd-analyze verify \
            "${units}/cec-injector-mate.service" \
            "${units}/cec-injector-mate-boot.service"

  gui-linux:
    name: GUI Linux
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Install GUI dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates cmake dbus-daemon g++ git libdrm-dev \
            libsystemd-dev libudev-dev make pkg-config qt6-base-dev \
            qt6-base-dev-tools

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure optional GUI
        run: |
          cmake -S . -B build/ci-gui \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCEC_INJECTOR_MATE_BUILD_LINUX=ON \
            -DCEC_INJECTOR_MATE_BUILD_GUI=ON

      - name: Build GUI
        run: cmake --build build/ci-gui --parallel

      - name: Test GUI and portable boundaries
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ci-gui --output-on-failure

  macos-gui:
    name: macOS GUI
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install GUI dependencies
        run: brew install pkg-config qt

      - name: Resolve Qt prefix
        run: echo "QT_CMAKE_PREFIX=$(brew --prefix qt)/lib/cmake" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build/ci-macos-gui \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCEC_INJECTOR_MATE_BUILD_MACOS=ON \
            -DCEC_INJECTOR_MATE_BUILD_GUI=ON \
            -DCMAKE_PREFIX_PATH="${QT_CMAKE_PREFIX}"

      - name: Build
        run: cmake --build build/ci-macos-gui --parallel

      - name: Test
        run: ctest --test-dir build/ci-macos-gui --output-on-failure

  patched-libcec:
    name: Patched libCEC tests
    runs-on: ubuntu-latest
    container: debian:12
    env:
      LIBCEC_COMMIT: 3519af0715e654c43382423d843ad658f2e01cb4
      P8_PLATFORM_COMMIT: 2748be52ae27e6007ef548b697d4a03ff7de4291
      LIBCEC_PATCH_SHA256: 2f7eb96e157735be3ea9a64cb933a61ad48e95887cdf5d3a701a98ee73fc4c2f

    steps:
      - name: Install production adapter dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils build-essential ca-certificates cmake git libdrm-dev \
            libsystemd-dev libudev-dev libx11-dev libxrandr-dev pkg-config

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch pinned public dependencies
        run: |
          git clone https://github.com/Pulse-Eight/libcec.git /tmp/libcec
          git -C /tmp/libcec checkout --detach "${LIBCEC_COMMIT}"
          test "$(git -C /tmp/libcec rev-parse HEAD)" = "${LIBCEC_COMMIT}"
          rm -rf /tmp/libcec/src/platform
          git clone https://github.com/Pulse-Eight/platform.git /tmp/libcec/src/platform
          git -C /tmp/libcec/src/platform checkout --detach "${P8_PLATFORM_COMMIT}"
          test "$(git -C /tmp/libcec/src/platform rev-parse HEAD)" = \
            "${P8_PLATFORM_COMMIT}"

      - name: Verify and apply maintained libCEC patch
        run: |
          echo "${LIBCEC_PATCH_SHA256}  third_party/libcec/libcec-7.1.1-project-adapter-v1.patch" \
            | sha256sum --check
          git -C /tmp/libcec apply \
            "${GITHUB_WORKSPACE}/third_party/libcec/libcec-7.1.1-project-adapter-v1.patch"

      - name: Build pinned p8-platform and libCEC
        run: |
          cmake -S /tmp/libcec/src/platform -B /tmp/p8-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/cec-prefix \
            -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/p8-build --parallel
          cmake --install /tmp/p8-build
          PKG_CONFIG_PATH=/tmp/cec-prefix/lib/pkgconfig \
            cmake -S /tmp/libcec -B /tmp/libcec-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/tmp/cec-prefix \
              -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/libcec-build --parallel
          cmake --install /tmp/libcec-build
          nm -D /tmp/cec-prefix/lib/libcec.so.7 \
            | grep ' cec_project_adapter_transaction_v1$'

      - name: Configure Mate against patched libCEC
        run: |
          PKG_CONFIG_PATH=/tmp/cec-prefix/lib/pkgconfig \
            cmake -S . -B build/ci-patched-libcec \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON \
              -DCEC_INJECTOR_MATE_BUILD_LINUX=ON \
              -DCEC_INJECTOR_MATE_BUILD_LIBCEC=ON

      - name: Build Mate
        run: cmake --build build/ci-patched-libcec --parallel

      - name: Run full tests
        run: |
          LD_LIBRARY_PATH=/tmp/cec-prefix/lib \
            ctest --test-dir build/ci-patched-libcec --output-on-failure

  macos-patched-libcec-gui:
    name: macOS patched libCEC + GUI
    runs-on: macos-26
    env:
      LIBCEC_COMMIT: 3519af0715e654c43382423d843ad658f2e01cb4
      P8_PLATFORM_COMMIT: 2748be52ae27e6007ef548b697d4a03ff7de4291
      LIBCEC_PATCH_SHA256: 2f7eb96e157735be3ea9a64cb933a61ad48e95887cdf5d3a701a98ee73fc4c2f
      CEC_PREFIX: /tmp/cec-prefix

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install macOS dependencies
        run: brew install pkg-config qt

      - name: Resolve Qt prefix
        run: echo "QT_CMAKE_PREFIX=$(brew --prefix qt)/lib/cmake" >> "$GITHUB_ENV"

      - name: Fetch pinned public dependencies
        run: |
          git clone https://github.com/Pulse-Eight/platform.git /tmp/p8-platform
          git -C /tmp/p8-platform checkout --detach "${P8_PLATFORM_COMMIT}"
          test "$(git -C /tmp/p8-platform rev-parse HEAD)" = "${P8_PLATFORM_COMMIT}"
          git clone https://github.com/Pulse-Eight/libcec.git /tmp/libcec
          git -C /tmp/libcec checkout --detach "${LIBCEC_COMMIT}"
          test "$(git -C /tmp/libcec rev-parse HEAD)" = "${LIBCEC_COMMIT}"

      - name: Verify and apply maintained libCEC patch
        run: |
          echo "${LIBCEC_PATCH_SHA256}  third_party/libcec/libcec-7.1.1-project-adapter-v1.patch" \
            | shasum -a 256 --check
          git -C /tmp/libcec apply \
            "${GITHUB_WORKSPACE}/third_party/libcec/libcec-7.1.1-project-adapter-v1.patch"

      - name: Build pinned p8-platform
        run: |
          cmake -S /tmp/p8-platform -B /tmp/p8-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${CEC_PREFIX}" \
            -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/p8-build --parallel
          cmake --install /tmp/p8-build

      - name: Build pinned libCEC
        run: |
          PKG_CONFIG_LIBDIR="${CEC_PREFIX}/lib/pkgconfig" \
          CMAKE_PREFIX_PATH="${CEC_PREFIX}" \
            cmake -S /tmp/libcec -B /tmp/libcec-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${CEC_PREFIX}" \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build /tmp/libcec-build --parallel
          cmake --install /tmp/libcec-build
          ! grep -nE '/opt/homebrew/Cellar/libcec|/opt/homebrew/Cellar/p8-platform|/opt/homebrew/include/libcec|/opt/homebrew/include/p8-platform' \
            /tmp/libcec-build/compile_commands.json
          nm -gU "${CEC_PREFIX}/lib/libcec.dylib" \
            | grep 'cec_project_adapter_transaction_v1'

      - name: Configure Mate against patched libCEC
        run: |
          PKG_CONFIG_LIBDIR="${CEC_PREFIX}/lib/pkgconfig" \
            cmake -S . -B build/ci-macos-patched-libcec-gui \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=ON \
              -DCEC_INJECTOR_MATE_BUILD_MACOS=ON \
              -DCEC_INJECTOR_MATE_BUILD_GUI=ON \
              -DCEC_INJECTOR_MATE_BUILD_LIBCEC=ON \
              -DCMAKE_PREFIX_PATH="${CEC_PREFIX};${QT_CMAKE_PREFIX}"

      - name: Build Mate
        run: cmake --build build/ci-macos-patched-libcec-gui --parallel

      - name: Verify runtime linkage
        run: |
          gui_bin=build/ci-macos-patched-libcec-gui/applications/gui/cec-injector-mate-gui.app/Contents/MacOS/cec-injector-mate-gui
          otool -L "$gui_bin" \
            | grep '@rpath/libcec.7.dylib'
          otool -L "$gui_bin" \
            | grep '@rpath/libp8-platform.2.dylib'
          otool -l "$gui_bin" \
            | grep -A2 LC_RPATH \
            | grep "${CEC_PREFIX}/lib"

      - name: Run full tests
        run: |
          DYLD_LIBRARY_PATH="${CEC_PREFIX}/lib" \
            ctest --test-dir build/ci-macos-patched-libcec-gui --output-on-failure
